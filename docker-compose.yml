version: '3.8'

services:
  # บริการ Backend API
  api:
    build: ./backend
    container_name: hvacr-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://db:27017/hvacr_db
    depends_on:
      - db
    restart: unless-stopped

  # บริการฐานข้อมูล MongoDB
  db:
    image: mongo:latest
    container_name: hvacr-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: